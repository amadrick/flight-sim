<title>Skyward Flight Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&family=Saira:wght@300;400;500;600;700&family=B612+Mono:wght@400;700&display=swap">
<style>
/* Layout: one full-viewport flight view; HUD canvas and DOM UI stacked above it.
   UI material: "Skyward glass" — translucent panels that blur and brighten the live scene behind them, with a specular
   rim lit from the sun's on-screen direction (--rim-angle, written by the menu every frame). Variants:
     .glass        regular glass for panels and sheets (blur 24px)
     .glass-clear  clearer, lighter glass for small floating controls (blur 14px)
     .glass-tint   amber-tinted glass for the one primary action
   The menu sets on <html>: data-scene="day|dusk|night" (tint adapts to the scene), .ui-lite (no backdrop blur:
   low quality, low frame rate or the user's choice), .ui-lens (Chromium: SVG refraction at control edges). */
:root {
  color-scheme: dark;
  --bg: #05080c;            /* night-sky black behind everything */
  --panel: #0c1218;         /* instrument panel surfaces (HUD deck) */
  --panel-2: #131c25;
  --line: #24323f;          /* hairlines, bezels */
  --fg: #f2f6fa;            /* primary text */
  --fg-dim: #a9b8c7;        /* secondary text (AA on every glass tint) */
  --fg-faint: rgba(214, 226, 238, 0.56);
  --accent: #ffb000;        /* aviation amber: selections, primary actions */
  --accent-ink: #1c1300;    /* text on amber */
  --hud: #5dff9b;           /* HUD phosphor green */
  --warn: #ff5a3c;          /* master-caution red */
  --ok: #4cc9f0;            /* cyan annunciations */
  --focus: #7fd8ff;         /* keyboard focus ring */
  --font-display: 'Saira Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Saira', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  --font-mono: 'B612 Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  /* glass material */
  --glass-rgb: 18 24 33;          /* tint colour */
  --glass-a: 0.45;                /* regular tint opacity */
  --glass-a-clear: 0.4;           /* clear tint opacity */
  --glass-a-solid: 0.9;           /* fallback without backdrop blur */
  --glass-blur: 24px;
  --glass-blur-clear: 14px;
  --glass-sat: 1.65;
  --glass-bright: 0.74;           /* darkens bright sky/cloud behind text: white text stays >= 4.5:1 over white cloud */
  --rim-angle: 160deg;            /* direction the light travels across the glass (sun → away) */
  --rim-hi: 0.6;                  /* specular rim strength on the lit edge */
  --rim-lo: 0.22;                 /* bounce on the opposite edge */
  --sheen: 0.09;
  --shadow: 0 12px 40px rgb(0 0 0 / 0.28), 0 2px 6px rgb(0 0 0 / 0.18);
  /* concentric radii: inner = outer - padding */
  --r-xl: 30px; --r-l: 22px; --r-m: 16px; --r-s: 12px; --r-xs: 8px; --r-pill: 999px;
  --spring: cubic-bezier(0.34, 1.32, 0.5, 1);   /* quick, slightly springy */
  --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(12px, env(safe-area-inset-top, 0px));
  --gb: max(16px, env(safe-area-inset-bottom, 0px));
}
:root[data-scene="dusk"] { --glass-rgb: 22 22 34; --glass-a: 0.46; --glass-bright: 0.86; --rim-hi: 0.52; }
:root[data-scene="night"] { --glass-rgb: 26 32 46; --glass-a: 0.46; --glass-bright: 1.12; --glass-a-clear: 0.34; --rim-hi: 0.36; --rim-lo: 0.16; --sheen: 0.06; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; touch-action: none; -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
#view, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }

/* ---- glass material ---------------------------------------------------------------------------------------- */
.glass, .glass-clear, .glass-tint { position: relative; isolation: isolate; border-radius: var(--r, var(--r-l)); }
.glass {
  background: rgb(var(--glass-rgb) / var(--glass-a));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
  box-shadow: var(--shadow);
}
.glass-clear {
  background: rgb(var(--glass-rgb) / var(--glass-a-clear));
  -webkit-backdrop-filter: blur(var(--glass-blur-clear)) saturate(1.8) brightness(var(--glass-bright));
  backdrop-filter: blur(var(--glass-blur-clear)) saturate(1.8) brightness(var(--glass-bright));
  box-shadow: 0 6px 22px rgb(0 0 0 / 0.22), 0 1px 3px rgb(0 0 0 / 0.16);
}
.glass-tint {
  background: linear-gradient(180deg, rgb(255 196 64 / 0.96), rgb(255 168 0 / 0.92));
  -webkit-backdrop-filter: blur(10px) saturate(1.6); backdrop-filter: blur(10px) saturate(1.6);
  color: var(--accent-ink);
  box-shadow: 0 10px 30px rgb(255 160 0 / 0.22), 0 2px 6px rgb(0 0 0 / 0.25);
}
/* specular rim: a 1px gradient ring, brightest on the edge facing the light */
.glass::before, .glass-clear::before, .glass-tint::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2;
  background: linear-gradient(var(--rim-angle),
    rgb(255 255 255 / var(--rim-hi)), rgb(255 255 255 / 0.14) 22%, rgb(255 255 255 / 0.05) 50%,
    rgb(255 255 255 / 0.08) 78%, rgb(255 255 255 / var(--rim-lo)));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.glass-tint::before { background: linear-gradient(var(--rim-angle), rgb(255 255 255 / 0.85), rgb(255 255 255 / 0.2) 30%, rgb(255 255 255 / 0) 60%, rgb(120 60 0 / 0.35)); }
/* inner sheen: soft light pooled under the lit edge */
.glass::after, .glass-clear::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: linear-gradient(var(--rim-angle), rgb(255 255 255 / var(--sheen)), rgb(255 255 255 / 0) 42%);
}
/* refraction at the edges (Chromium only, small controls only; see menu/glass.js) */
:root.ui-lens .glass-lens { -webkit-backdrop-filter: url(#sky-lens) blur(var(--glass-blur-clear)) saturate(1.8) brightness(var(--glass-bright)); backdrop-filter: url(#sky-lens) blur(var(--glass-blur-clear)) saturate(1.8) brightness(var(--glass-bright)); }
/* cheap material: no backdrop sampling at all */
:root.ui-lite .glass, :root.ui-lite .glass-clear, :root.ui-lite .glass-lens { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
:root.ui-lite .glass { background: rgb(var(--glass-rgb) / 0.84); }
:root.ui-lite .glass-clear { background: rgb(var(--glass-rgb) / 0.72); }
@media (prefers-reduced-transparency: reduce) {
  .glass, .glass-clear, .glass-lens { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  .glass { background: rgb(var(--glass-rgb) / var(--glass-a-solid)); }
  .glass-clear { background: rgb(var(--glass-rgb) / 0.85); }
}

#boot { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 0%, #142233 0%, var(--bg) 70%); z-index: 50; }
#boot .box { display: grid; gap: 16px; justify-items: center; padding-left: var(--gl); padding-right: var(--gr); }
#boot h1 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; font-size: clamp(22px, 4vw, 36px); margin: 0; padding-left: 0.3em; }
#boot p { font-family: var(--font-body); font-size: 13px; color: var(--fg-dim); letter-spacing: 0.04em; margin: 0; }
#boot .bar { width: min(220px, 60vw); height: 4px; border-radius: 2px; background: rgb(255 255 255 / 0.1); overflow: hidden; }
#boot .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--accent); animation: boot-slide 1.1s ease-in-out infinite alternate; }
@keyframes boot-slide { from { transform: translateX(-20%); } to { transform: translateX(170%); } }
@media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; } }
</style>
<div id="stage">
  <canvas id="view" aria-label="Flight view"></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>
  <div id="ui"></div>
  <div id="boot"><div class="box"><h1>Skyward</h1><div class="bar"></div><p id="boot-status">Starting</p></div></div>
</div>
<script>/*__BUNDLE__*/</script>
