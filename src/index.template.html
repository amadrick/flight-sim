<title>Skyward Flight Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&family=Saira:wght@300;400;500;600&family=B612+Mono:wght@400;700&display=swap">
<style>
/* Layout: one full-viewport flight view; HUD canvas and DOM UI stacked above it. Single dark "flight deck" look by design. */
:root {
  color-scheme: dark;
  --bg: #05080c;            /* night-sky black behind everything */
  --panel: #0c1218;         /* instrument panel surfaces */
  --panel-2: #131c25;
  --line: #24323f;          /* hairlines, bezels */
  --fg: #e6edf3;            /* primary text */
  --fg-dim: #8fa1b3;        /* secondary text */
  --accent: #ffb000;        /* aviation amber: selections, primary actions */
  --hud: #5dff9b;           /* HUD phosphor green */
  --warn: #ff5a3c;          /* master-caution red */
  --ok: #4cc9f0;            /* cyan annunciations */
  --font-display: 'Saira Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Saira', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  --font-mono: 'B612 Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; touch-action: none; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
#view, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
#boot { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 50; }
#boot .box { display: grid; gap: 14px; justify-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#boot h1 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; font-size: clamp(20px, 4vw, 34px); margin: 0; }
#boot p { font-family: var(--font-mono); font-size: 12px; color: var(--fg-dim); letter-spacing: 0.12em; text-transform: uppercase; margin: 0; }
#boot .bar { width: min(260px, 60vw); height: 2px; background: var(--line); overflow: hidden; }
#boot .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); animation: boot-slide 1.1s ease-in-out infinite alternate; }
@keyframes boot-slide { from { transform: translateX(-20%); } to { transform: translateX(170%); } }
@media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; } }
</style>
<div id="stage">
  <canvas id="view" aria-label="Flight view"></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>
  <div id="ui"></div>
  <div id="boot"><div class="box"><h1>Skyward</h1><div class="bar"></div><p id="boot-status">Starting</p></div></div>
</div>
<script>/*__BUNDLE__*/</script>
